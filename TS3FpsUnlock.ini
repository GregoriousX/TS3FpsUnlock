; TS3FpsUnlock - frame rate unlock for Toy Story 3: Complete Edition
; Changes take effect after restarting the game.

[FPS]
; 0 = plugin does nothing
Enabled=1

; Frame rate cap used when the in-game option "Frame cap" is set to 60.
; "Frame cap 30" still gives 30. Range 30..360.
; With VSync=1 set this to your monitor refresh rate (or an even divisor of it).
TargetFPS=120

; 1 = keep the game's VSync (frame rate is also limited by the monitor refresh rate)
; 0 = present without VSync; recommended with G-Sync/FreeSync monitors,
;     or on a 60 Hz monitor if you want more than 60 FPS
VSync=1

; Experimental: the game measures frame time in whole milliseconds, so at 120 FPS
; frame times alternate 8/8/9 ms. 1 = give the game a sub-millisecond frame time.
PreciseDeltaTime=0

; 1 = write the measured average FPS to TS3FpsUnlock.log every 10 seconds
LogStats=0
